<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>憲法原則使用型態分群</title><script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script><style>
:root{--paper:#fffaf0;--paper2:#f5ecd5;--ink:#2d2822;--muted:#6b5e52;--line:#3e352c;--teal:#4aa3a2;--yellow:#f3c969;--pink:#e76f82;--green:#80bd7a;--blue:#5ca7df}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;color:var(--ink);font-family:"Noto Sans TC","Microsoft JhengHei",sans-serif;background:linear-gradient(rgba(74,163,162,.12) 1px,transparent 1px),var(--paper2);background-size:100% 30px}.wrap{max-width:1180px;margin:auto;padding:34px 28px 48px}header{display:flex;justify-content:space-between;gap:20px;align-items:flex-start}h1{margin:0 0 8px;font-size:38px;line-height:1.16;text-shadow:2px 2px 0 rgba(243,201,105,.48)}h2{margin:0 0 12px;font-size:25px}h3{margin:12px 0 8px;color:#2f7777}p{color:var(--muted);line-height:1.58}.btn,button,select,input{border:2px solid var(--line);border-radius:8px 13px 7px 12px;background:#fffaf0;color:#2f7777;padding:9px 12px;font-weight:900;box-shadow:3px 4px 0 rgba(62,53,44,.12)}.btn{text-decoration:none;display:inline-block;white-space:nowrap}button{cursor:pointer}button.active{background:#fff4b8;color:#2d2822}.hintText{color:#e76f82;font-weight:900;font-size:16px;align-self:center;margin-left:-4px}.panel{background:rgba(255,250,240,.9);border:2px solid var(--line);border-radius:12px 18px 10px 16px;box-shadow:6px 7px 0 rgba(62,53,44,.13);padding:18px;margin-top:18px}.grid{display:grid;grid-template-columns:1.15fr .85fr;gap:18px}.controls{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:12px}.note{background:#fff4b8;border:2px solid var(--line);border-radius:9px 14px 8px 13px;padding:12px 14px;margin-top:12px;color:#2d2822}.bigFormula{background:#fffaf0;border:2px dashed rgba(62,53,44,.55);border-radius:12px 18px 10px 16px;padding:18px;margin-top:14px;color:#2d2822;font-weight:900;font-size:23px;line-height:1.45}.chart{height:520px}.chart.small{height:390px}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.cards.three{grid-template-columns:repeat(3,1fr)}.cards.four{grid-template-columns:repeat(4,1fr)}.cards>div{background:#fffaf0;border:2px dashed rgba(62,53,44,.55);border-radius:12px 18px 10px 16px;padding:15px;min-height:145px}.card{background:#fffaf0;border:2px dashed rgba(62,53,44,.55);border-radius:12px 18px 10px 16px;padding:15px;min-height:145px}.card b{display:block;color:#2f7777;font-size:20px;margin-bottom:8px}.card span{display:block;color:var(--muted);line-height:1.45}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.stats div{background:#fffaf0;border:2px solid rgba(62,53,44,.5);border-radius:10px 16px 9px 14px;padding:14px;text-align:center}.stats b{display:block;color:#2f7777;font-size:32px}table{width:100%;border-collapse:separate;border-spacing:0;color:var(--muted);font-size:15.5px}th,td{border-bottom:1.5px dashed rgba(62,53,44,.28);padding:10px;text-align:left;vertical-align:top}thead th{background:#d9f0e2;color:#2f7777;cursor:pointer}tbody td:first-child{color:#2f7777;font-weight:900}.tableWrap{max-height:520px;overflow:auto}.fallback{display:grid;gap:9px}.row{display:grid;grid-template-columns:180px 1fr 60px;gap:9px;align-items:center}.track{height:23px;border:2px solid rgba(62,53,44,.32);border-radius:999px;background:rgba(62,53,44,.08);overflow:hidden}.fill{height:100%;border-radius:999px;background:#4aa3a2}.footer{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}.missing{display:grid;place-items:center;min-height:220px;color:var(--muted);border:2px dashed rgba(62,53,44,.45);border-radius:12px;background:rgba(255,250,240,.7)}@media(max-width:900px){header,.grid{display:block}.cards,.cards.three,.cards.four,.stats{grid-template-columns:1fr}.chart{height:420px}}
.hintText{color:#e76f82;font-weight:900;font-size:16px;margin-left:12px}.groupPickCards .card{cursor:pointer;transition:transform .16s ease,box-shadow .16s ease}.groupPickCards .card.active{background:#fff4b8;border-color:#2f7777;transform:translateY(-3px);box-shadow:7px 8px 0 rgba(62,53,44,.16)}.groupPickCards .card p:last-child{display:none}</style></head><body><div class="wrap"><header><div><h1>引用規模與判斷方向分群</h1><p>依 PI 值與引用篇數整理憲法原則在資料中的使用型態。橫軸看方向，縱軸看規模。</p></div><a class="btn" href="slides.html#40">返回主簡報40頁</a></header><section class="panel"><h2>圖表判讀</h2><div class="note">從縱軸觀察，引用篇數較高的原則位於圖形上方；從橫軸觀察，PI 值顯示原則較偏合憲、偏違憲或雙向使用。低引用原則位於圖形下方，即使 PI 值極端，也不作穩定傾向推論。</div></section><section class="panel"><h2>分群結果<span class="hintText">← 點擊篩選呈現於下方【互動散點圖】及【分群原則清單】</span></h2><div id="groupCardsDash" class="cards groupPickCards"></div></section><section class="panel"><h2>互動散點圖</h2><div id="scatter" class="chart"></div></section><section class="panel"><h2>分群原則清單</h2><div class="tableWrap"><table id="groupTable"></table></div></section><div class="footer"><a class="btn" href="slides.html#40">返回主簡報40頁 →</a><a class="btn" href="pi_direction_dashboard.html">查看 PI 與判斷方向 →</a></div></div><script>
const principles=[{"id": 6, "name": "比例原則", "count": 140, "pct": 17.22, "con": 53, "uncon": 44, "pi": 0.09, "firstYear": 1996, "firstCase": 409, "firstSource": "解釋文"}, {"id": 8, "name": "平等原則", "count": 112, "pct": 13.78, "con": 36, "uncon": 25, "pi": 0.18, "firstYear": 1983, "firstCase": 179, "firstSource": "解釋文"}, {"id": 19, "name": "法律明確性原則", "count": 64, "pct": 7.87, "con": 20, "uncon": 7, "pi": 0.48, "firstYear": 1991, "firstCase": 276, "firstSource": "解釋文"}, {"id": 20, "name": "法律保留原則", "count": 64, "pct": 7.87, "con": 16, "uncon": 27, "pi": -0.26, "firstYear": 1993, "firstCase": 313, "firstSource": "解釋文"}, {"id": 27, "name": "最小侵害原則／必要性原則", "count": 55, "pct": 6.77, "con": 4, "uncon": 22, "pi": -0.69, "firstYear": 1964, "firstCase": 105, "firstSource": "解釋文"}, {"id": 24, "name": "租稅法律原則", "count": 51, "pct": 6.27, "con": 25, "uncon": 14, "pi": 0.28, "firstYear": 1977, "firstCase": 151, "firstSource": "解釋文"}, {"id": 21, "name": "法律授權明確原則", "count": 45, "pct": 5.54, "con": 6, "uncon": 3, "pi": 0.33, "firstYear": 1993, "firstCase": 313, "firstSource": "解釋文"}, {"id": 9, "name": "正當法律程序原則", "count": 26, "pct": 3.2, "con": 5, "uncon": 9, "pi": -0.29, "firstYear": 1996, "firstCase": 396, "firstSource": "解釋文"}, {"id": 23, "name": "信賴保護原則", "count": 24, "pct": 2.95, "con": 9, "uncon": 0, "pi": 1, "firstYear": 1994, "firstCase": 362, "firstSource": "解釋文＋理由書"}, {"id": 18, "name": "法治國原則", "count": 16, "pct": 1.97, "con": 0, "uncon": 0, "pi": null, "firstYear": 2001, "firstCase": 520, "firstSource": "理由書"}, {"id": 30, "name": "權力分立原則", "count": 16, "pct": 1.97, "con": 1, "uncon": 4, "pi": -0.6, "firstYear": 1994, "firstCase": 342, "firstSource": "理由書"}, {"id": 16, "name": "法不溯及既往原則", "count": 13, "pct": 1.6, "con": 5, "uncon": 0, "pi": 1, "firstYear": 1999, "firstCase": 493, "firstSource": "理由書"}, {"id": 10, "name": "民主國原則", "count": 9, "pct": 1.11, "con": 0, "uncon": 0, "pi": null, "firstYear": 2000, "firstCase": 499, "firstSource": "理由書"}, {"id": 28, "name": "罪刑法定原則／罪刑法定主義", "count": 9, "pct": 1.11, "con": 1, "uncon": 1, "pi": 0, "firstYear": 1995, "firstCase": 384, "firstSource": "理由書"}, {"id": 29, "name": "罪刑相當原則", "count": 9, "pct": 1.11, "con": 3, "uncon": 4, "pi": -0.14, "firstYear": 2005, "firstCase": 602, "firstSource": "解釋文＋理由書"}, {"id": 17, "name": "法安定性原則", "count": 8, "pct": 0.98, "con": 1, "uncon": 0, "pi": 1, "firstYear": 2003, "firstCase": 570, "firstSource": "理由書"}, {"id": 1, "name": "一行為不二罰原則", "count": 6, "pct": 0.74, "con": 2, "uncon": 0, "pi": 1, "firstYear": 2005, "firstCase": 604, "firstSource": "解釋文＋理由書"}, {"id": 5, "name": "公平審判原則", "count": 6, "pct": 0.74, "con": 0, "uncon": 0, "pi": null, "firstYear": 1990, "firstCase": 256, "firstSource": "解釋文"}, {"id": 26, "name": "責任政治原則", "count": 6, "pct": 0.74, "con": 0, "uncon": 1, "pi": -1, "firstYear": 1995, "firstCase": 387, "firstSource": "解釋文"}, {"id": 13, "name": "多數決原則", "count": 3, "pct": 0.37, "con": 0, "uncon": 0, "pi": null, "firstYear": 1957, "firstCase": 76, "firstSource": "解釋文"}, {"id": 22, "name": "法律優越原則", "count": 3, "pct": 0.37, "con": 0, "uncon": 1, "pi": -1, "firstYear": 2004, "firstCase": 573, "firstSource": "解釋文"}, {"id": 25, "name": "國民主權原則", "count": 3, "pct": 0.37, "con": 0, "uncon": 0, "pi": null, "firstYear": 2000, "firstCase": 499, "firstSource": "解釋文＋理由書"}, {"id": 3, "name": "一罪不二罰原則", "count": 2, "pct": 0.25, "con": 0, "uncon": 1, "pi": -1, "firstYear": 2021, "firstCase": 808, "firstSource": "解釋文＋理由書"}, {"id": 4, "name": "中央地方均權原則", "count": 2, "pct": 0.25, "con": 2, "uncon": 0, "pi": 1, "firstYear": 1999, "firstCase": 498, "firstSource": "解釋文＋理由書"}, {"id": 7, "name": "代議民主原則", "count": 2, "pct": 0.25, "con": 1, "uncon": 0, "pi": 1, "firstYear": 2000, "firstCase": 499, "firstSource": "解釋文"}, {"id": 12, "name": "共和國原則", "count": 2, "pct": 0.25, "con": 0, "uncon": 0, "pi": null, "firstYear": 2000, "firstCase": 499, "firstSource": "解釋文＋理由書"}, {"id": 15, "name": "明顯區隔原則", "count": 2, "pct": 0.25, "con": 1, "uncon": 2, "pi": -0.33, "firstYear": 2020, "firstCase": 799, "firstSource": "解釋文"}, {"id": 2, "name": "一事不再理原則", "count": 1, "pct": 0.12, "con": 0, "uncon": 1, "pi": -1, "firstYear": 2019, "firstCase": 775, "firstSource": "解釋文＋理由書"}, {"id": 11, "name": "民生福利國原則", "count": 1, "pct": 0.12, "con": 0, "uncon": 0, "pi": null, "firstYear": 1999, "firstCase": 485, "firstSource": "解釋文＋理由書"}, {"id": 14, "name": "宗教中立原則", "count": 1, "pct": 0.12, "con": 0, "uncon": 1, "pi": -1, "firstYear": 2004, "firstCase": 573, "firstSource": "解釋文＋理由書"}], groups=[{"type": "關鍵雙向型原則", "rule": "引用篇數≥5，且 -0.3 < PI < 0.3", "examples": "比例原則、平等原則、正當法律程序原則、法律保留原則、租稅法律原則、罪刑法定原則／罪刑法定主義、罪刑相當原則", "feature": "具有一定引用規模，且可同時出現在合憲與違憲判斷中"}, {"type": "合憲支持型原則", "rule": "引用篇數≥5，且PI ≥ 0.3", "examples": "一行為不二罰原則、法不溯及既往原則、法安定性原則、法律明確性原則、法律授權明確原則、信賴保護原則", "feature": "較常與合憲判斷連結"}, {"type": "違憲警示型原則", "rule": "引用篇數≥5，且PI ≤ -0.3", "examples": "責任政治原則、最小侵害原則／必要性原則、權力分立原則", "feature": "較常與違憲判斷連結"}, {"type": "低引用觀察群", "rule": "引用篇數<5", "examples": "一事不再理原則、一罪不二罰原則、中央地方均權原則、代議民主原則、宗教中立原則、明顯區隔原則、法律優越原則", "feature": "引用篇數較低，不作傾向推論"}, {"type": "不涉判斷方向群", "rule": "無PI值", "examples": "公平審判原則、民主國原則、民生福利國原則、共和國原則、多數決原則、法治國原則、國民主權原則。", "feature": "未出現可計入合憲或違憲方向之引用"}];let active='全部';
function groupOf(d){let sample=(d.con||0)+(d.uncon||0); if(d.pi===null||sample===0)return '不涉判斷方向群'; if(d.count<5)return '低引用觀察群'; if(d.pi>=0.3)return '合憲支持型原則'; if(d.pi<=-0.3)return '違憲警示型原則'; return '關鍵雙向型原則';}
function rows(){return principles.map(d=>({...d,sample:(d.con||0)+(d.uncon||0),group:groupOf(d)}))}
function draw(){document.querySelectorAll('[data-group]').forEach(b=>b.classList.toggle('active',b.dataset.group===active));let r=rows();let plotRows=r.filter(d=>d.pi!==null);let colors={'關鍵雙向型原則':'#5ca7df','合憲支持型原則':'#80bd7a','違憲警示型原則':'#e76f82','低引用觀察群':'#f3c969','不涉判斷方向群':'#aaa'};let op=plotRows.map(d=>active==='全部'||d.group===active?1:.16);let maxY=Math.max(8,...plotRows.map(d=>d.count||0));if(window.Plotly){Plotly.newPlot('scatter',[{type:'scatter',mode:'markers+text',x:plotRows.map(d=>d.pi),y:plotRows.map(d=>d.count),text:plotRows.map(d=>d.count>=20?d.name.replace('原則',''):''),textposition:'top center',marker:{size:plotRows.map(d=>10+Math.sqrt(Math.max(1,d.sample))*4),color:plotRows.map(d=>colors[d.group]),opacity:op,line:{color:'#3e352c',width:2}},customdata:plotRows.map(d=>[d.name,d.con,d.uncon,d.count,d.group,d.sample]),hovertemplate:'%{customdata[0]}<br>PI：%{x}<br>引用篇數：%{y}<br>合憲數：%{customdata[1]}<br>違憲數：%{customdata[2]}<br>可計算樣本：%{customdata[5]}<br>分群：%{customdata[4]}<extra></extra>'}],{paper_bgcolor:'rgba(0,0,0,0)',plot_bgcolor:'rgba(255,250,240,.72)',margin:{l:65,r:25,t:28,b:55},xaxis:{title:'PI 值',range:[-1.05,1.05]},yaxis:{title:'引用篇數',range:[0,200]},shapes:[{type:'line',xref:'x',yref:'paper',x0:0,x1:0,y0:0,y1:1,line:{color:'#3e352c',dash:'dash',width:2}},{type:'line',xref:'x',yref:'paper',x0:.3,x1:.3,y0:0,y1:1,line:{color:'#4aa3a2',dash:'dot',width:2}},{type:'line',xref:'x',yref:'paper',x0:-.3,x1:-.3,y0:0,y1:1,line:{color:'#e76f82',dash:'dot',width:2}},{type:'line',xref:'paper',yref:'y',x0:0,x1:1,y0:5,y1:5,line:{color:'#f3c969',dash:'dash',width:3}},{type:'rect',xref:'paper',yref:'y',x0:0,x1:1,y0:0,y1:5,fillcolor:'rgba(243,201,105,.12)',line:{width:0},layer:'below'}],annotations:[{xref:'x',yref:'paper',x:-.3,y:1.04,text:'PI=-0.3',showarrow:false,font:{color:'#e76f82',size:13}},{xref:'x',yref:'paper',x:0,y:1.04,text:'PI=0',showarrow:false,font:{color:'#3e352c',size:13}},{xref:'x',yref:'paper',x:.3,y:1.04,text:'PI=0.3',showarrow:false,font:{color:'#2f7777',size:13}},{xref:'paper',yref:'y',x:.98,y:5,text:'引用篇數=5',showarrow:false,font:{color:'#8a6a21',size:13}}],hoverlabel:{bgcolor:'#fffaf0',bordercolor:'#3e352c',font:{color:'#2d2822',size:14}},showlegend:false},{displayModeBar:false,responsive:true});}table(r.filter(d=>active==='全部'||d.group===active))}
function cards(){document.getElementById('groupCardsDash').innerHTML=['全部',...groups.map(g=>g.type)].map(name=>{let g=groups.find(x=>x.type===name);return name==='全部'?`<div class="card active" data-group="全部"><b>全部</b><span>顯示五種分群與所有原則</span><p>完整資料</p></div>`:`<div class="card" data-group="${g.type}"><b>${g.type}</b><span>${g.feature}</span><p>${g.rule}</p></div>`}).join('')}
function table(r){r.sort((a,b)=>b.count-a.count);document.getElementById('groupTable').innerHTML='<thead><tr><th>分群</th><th>原則名稱</th><th>引用篇數</th><th>合憲數</th><th>違憲數</th><th>PI</th></tr></thead><tbody>'+r.map(d=>`<tr><td>${d.group}</td><td>${d.name}</td><td>${d.count}</td><td>${d.con??'-'}</td><td>${d.uncon??'-'}</td><td>${d.pi??'-'}</td></tr>`).join('')+'</tbody>'}
document.body.addEventListener('click',e=>{let g=e.target.closest('[data-group]');if(g){active=g.dataset.group;draw()}});cards();draw();
</script></body></html>
