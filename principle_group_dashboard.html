ns:1fr}}</style></head><body><div class="wrap"><header><div><h1>引用規模與判斷方向分群</h1><p>依 PI 值與引用篇數整理憲法原則在資料中的使用型態。橫軸看方向，縱軸看規模。</p></div><a class="btn" href="slides.html#40">返回主簡報40頁</a></header><section class="panel"><h2>圖表判讀</h2><div class="note">從縱軸觀察，引用篇數較高的原則位於圖形上方；從橫軸觀察，PI 值顯示原則較偏合憲、偏違憲或雙向使用。低引用原則位於圖形下方，即使 PI 值極端，也不作穩定傾向推論。</div></section><section class="panel"><h2>分群結果<span class="hintText">↓ 點擊篩選呈現於下方【互動散點圖】及【分群原則清單】</span></h2><div id="groupCardsDash" class="cards groupPickCards"></div><div class="groupMeaning"><button class="meaningCard" data-group="關鍵雙向型原則"><em>1</em><h3>關鍵雙向型原則</h3><p class="meaningRule">引用篇數≥5，且 -0.3 &lt; PI &lt; 0.3</p><b>特點</b><p>具有一定引用規模，可同時出現在合憲與違憲判斷中。</p><b>法學意義</b><p>多屬一般性審查框架，用來判斷國家權力是否逾越憲法界線。</p></button><button class="meaningCard" data-group="合憲支持型原則"><em>2</em><h3>合憲支持型原則</h3><p class="meaningRule">引用篇數≥5，且 PI ≥ 0.3</p><b>特點</b><p>PI 值偏正，較常與合憲判斷連結。</p><b>法學意義</b><p>多與法律秩序的明確性、穩定性、可預見性有關，常用來支持既有制度仍在憲法容許範圍內。</p></button><button class="meaningCard" data-group="違憲警示型原則"><em>3</em><h3>違憲警示型原則</h3><p class="meaningRule">引用篇數≥5，且 PI ≤ -0.3</p><b>特點</b><p>PI 值偏負，較常與違憲判斷連結。</p><b>法學意義</b><p>多用於提示國家權力配置失衡、責任不足或限制手段過度。</p></button><button class="meaningCard" data-group="低引用觀察群"><em>4</em><h3>低引用觀察群</h3><p class="meaningRule">引用篇數&lt;5，不作穩定方向推論</p><b>特點</b><p>引用篇數未達五篇，不作穩定方向推論。</p><b>法學意義</b><p>多出現在特定憲法爭議場域，適合描述，不宜過度推論。</p></button><button class="meaningCard" data-group="不涉判斷方向群"><em>5</em><h3>不涉判斷方向群</h3><p class="meaningRule">無可計入合憲或違憲方向之 PI 值</p><b>特點</b><p>無可計入合憲或違憲方向之 PI 值。</p><b>法學意義</b><p>多作為憲法秩序、制度定位或權利保障的背景性說明，不直接承擔合憲或違憲判斷功能。</p></button></div></section><section class="panel"><h2>互動散點圖</h2><div id="scatter" class="chart"></div></section><section class="panel"><h2>分群原則清單</h2><div class="tableWrap"><table id="groupTable"></table></div></section><div class="footer"><a class="btn" href="slides.html#40">返回主簡報40頁 →</a><a class="btn" href="pi_direction_dashboard.html">查看 PI 與判斷方向 →</a></div></div><script>

function groupOf(d){let sample=(d.con||0)+(d.uncon||0); if(d.pi===null||sample===0)return '不涉判斷方向群'; if(d.count<5)return '低引用觀察群'; if(d.pi>=0.3)return '合憲支持型原則'; if(d.pi<=-0.3)return '違憲警示型原則'; return '關鍵雙向型原則';}

function draw(){document.querySelectorAll('[data-group]').forEach(b=>b.classList.toggle('active',b.dataset.group===active));let r=rows();let plotRows=r.filter(d=>d.pi!==null);let colors={'關鍵雙向型原則':'#5ca7df','合憲支持型原則':'#80bd7a','違憲警示型原則':'#e76f82','低引用觀察群':'#f3c969','不涉判斷方向群':'#aaa'};let op=plotRows.map(d=>active==='全部'||d.group===active?1:.16);let maxY=Math.max(8,...plotRows.map(d=>d.count||0));if(window.Plotly){Plotly.newPlot('scatter',[{type:'scatter',mode:'markers+text',x:plotRows.map(d=>d.pi),y:plotRows.map(d=>d.count),text:plotRows.map(d=>d.count>=20?d.name:''),textposition:'top center',marker:{size:plotRows.map(d=>10+Math.sqrt(Math.max(1,d.sample))*4),color:plotRows.map(d=>colors[d.group]),opacity:op,line:{color:'#3e352c',width:2}},customdata:plotRows.map(d=>[d.name,d.con,d.uncon,d.count,d.group,d.sample]),hovertemplate:'%{customdata[0]}<br>PI：%{x}<br>引用篇數：%{y}<br>合憲數：%{customdata[1]}<br>違憲數：%{customdata[2]}<br>可計算樣本：%{customdata[5]}<br>分群：%{customdata[4]}<extra></extra>'}],{paper_bgcolor:'rgba(0,0,0,0)',plot_bgcolor:'rgba(255,250,240,.72)',margin:{l:65,r:25,t:28,b:55},xaxis:{title:'PI 值',range:[-1.05,1.05]},yaxis:{title:'引用篇數',range:[0,200]},shapes:[{type:'line',xref:'x',yref:'paper',x0:0,x1:0,y0:0,y1:1,line:{color:'#3e352c',dash:'dash',width:2}},{type:'line',xref:'x',yref:'paper',x0:.3,x1:.3,y0:0,y1:1,line:{color:'#4aa3a2',dash:'dot',width:2}},{type:'line',xref:'x',yref:'paper',x0:-.3,x1:-.3,y0:0,y1:1,line:{color:'#e76f82',dash:'dot',width:2}},{type:'line',xref:'paper',yref:'y',x0:0,x1:1,y0:5,y1:5,line:{color:'#f3c969',dash:'dash',width:3}},{type:'rect',xref:'paper',yref:'y',x0:0,x1:1,y0:0,y1:5,fillcolor:'rgba(243,201,105,.12)',line:{width:0},layer:'below'}],annotations:[{xref:'x',yref:'paper',x:-.3,y:1.04,text:'PI=-0.3',showarrow:false,font:{color:'#e76f82',size:13}},{xref:'x',yref:'paper',x:0,y:1.04,text:'PI=0',showarrow:false,font:{color:'#3e352c',size:13}},{xref:'x',yref:'paper',x:.3,y:1.04,text:'PI=0.3',showarrow:false,font:{color:'#2f7777',size:13}},{x function cards(){document.getElementById('groupCardsDash').innerHTML='<div class="card active" data-group="全部"><b>全部</b><span>顯示五種分群與所有原則</span><p>完整資料</p></div>'}
function table(r){r.sort((a,b)=>b.count-a.count);document.getElementById('groupTable').innerHTML='<thead><tr><th>分群</th><th>原則名稱</th><th>引用篇數</th><th>合憲數</th><th>違憲數</th><th>PI</th></tr></thead><tbody>'+r.map(d=>`<tr><td>${d.group}</td><td>${d.name}</td><td>${d.count}</td><td>${d.con??'-'}</td><td>${d.uncon??'-'}</td><td>${d.pi??'-'}</td></tr>`).join('')+'</tbody>'}
document.body.addEventListener('click',e=>{let g=e.target.closest('[data-group]');if(g){active=g.dataset.group;draw()}});cards();draw();
</script><script id="return-to-deck-script">
(function(){
  const params = new URLSearchParams(location.search);
  const back = params.get('back');
  if (!back || !/^(slides|mobile|slides_4x3|slides_800x600|slides_1024x768|story_slides|story_slides_800x600|story_slides_1024x768)\.html#(?:slide-)?\d+$/.test(back)) return;
  const pageMatch = back.match(/#(?:slide-)?(\d+)$/);
  const pageText = pageMatch ? `返回第 ${pageMatch[1]} 頁 →` : '返回主簡報 →';
  const deckFiles = /^(slides|mobile|slides_4x3|slides_800x600|slides_1024x768|story_slides|story_slides_800x600|story_slides_1024x768)\.html/i;
  const mainFiles = /^(index|slides|mobile|slides_4x3|slides_800x600|slides_1024x768|story_slides|story_slides_800x600|story_slides_1024x768)\.html$/i;
  document.querySelectorAll('a[href]').forEach(a => {
    const href = a.getAttribute('href') || '';
    const text = a.textContent || '';
    const file = (href.split(/[?#]/)[0].split('/').pop() || '');
    if (deckFiles.test(file) || /返回主簡報|返回第|返回 slides\.html/i.test(text)) {
      a.setAttribute('href', back);
      if (/返回主簡報|返回第|返回 slides\.html/i.test(text)) a.textContent = pageText;
      return;
    }
    if (/\.html$/i.test(file) && !mainFiles.test(file) && !/^(https?:|mailto:|tel:)/i.test(href)) {
      const u = new URL(href, location.href);
      u.searchParams.set('back', back);
      a.setAttribute('href', u.pathname.split('/').pop() + u.search + u.hash);
    }
  });
})();
</script></body></html>
