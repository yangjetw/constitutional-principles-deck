-", "paragraph_id": "1", "sentence_text": "其授權之目的、內容及範圍應具體明確", "label_code": "-1", "label_name": "無判斷詞", "note": "", "long_sentence": "對證券負責人及業務人員違反其業務上禁止、停止或限制命令之行為科處刑罰，涉及人民權利之限制，其刑罰之構成要件，應由法律定之；若法律就其構成要件，授權以命令為補充規定者，其授權之目的、內容及範圍應具體明確，而自授權之法律規定中得預見其行為之可罰，方符刑罰明確性原則", "match_basis": "-"}, {"principle_name": "法律明確性原則", "raw_expression": "方符刑罰明確性原則", "jy_number": 522, "year": "-", "location": "-", "paragraph_id": "1", "sentence_text": "方符刑罰明確性原則", "label_code": "0", "label_name": "不明確", "note": "規範性陳述", "long_sentence": "-", "match_basis": "方 + 符"}, {"principle_name": "法律明確性原則", "raw_expression": "惟同條例對於法院得裁定留置之要件並未明確規定", "jy_number": 523, "year": "-", "location": "-", "paragraph_id": "2", "sentence_text": "惟同條例對於法院得裁定留置之要件並未明確規定", "label_code": "-1", "label_name": "無判斷詞", "note": "", "long_sentence": "檢肅流氓條例第十一條第一項規定：「法院對被移送裁定之人，得予留置，其期間不得逾一月。但有繼續留置之必要者，得延長一月，以一次為限。」此項留置處分，係為確保感訓處分程序順利進行，於被移送裁定之人受感訓處分確定前，拘束其身體自由於一定處所之強制處分，乃對人民人身自由所為之嚴重限制，惟同條例對於法院得裁定留置之要件並未明確規定，其中除第六條、第七條所定之事由足認其有逕行拘提之原因而得推論具備留置之正當理由外，不論被移送裁定之人是否有繼續嚴重破壞社會秩序之虞，或有逃亡、湮滅事證或對檢舉人、被害人或證人造成威脅等足以妨礙後續審理之虞，均委由法院自行裁量，逕予裁定留置被移送裁定之人，上開條例第十一條第一項之規定，就此而言已逾越必要程度，與憲法第八條、第二十三條及前揭本院解釋意旨不符，應於本解釋公布之日起一年內失其效力", "match_basis": "-"}, {"principle_name": "最小侵害原則／必要性原則", "raw_expression": "就此而言已逾越必要程度", "jy_number": 523, "year": "-", "location": "-", "paragraph_id": "2", "sentence_text": "就此而言已逾越必要程度", "label_code": "2", "label_name": "違憲", "note": "標準邏輯", "long_sentence": "-", "match_basis": "逾越 (否定 x0)"}, {"principle_name": "法律明確性原則", "raw_expression": "故對於因保險所生之權利義務應有明確之規範", "jy_number": 524, "year": "-", "location": "-", "paragraph_id": "1", "sentence_text": "故對於因保險所生之權利義務應有明確之規範", "label_code": "-1", "label_name": "無判斷詞", "note": "", "long_sentence": "全民健康保險為強制性之社會保險，攸關全體國民之福祉至鉅，故對於因保險所生之權利義務應有明確之規範，並有法律保留原則之適用", "match_basis": "-"}, {"principle_name": "法律保留原則", "raw_expression": "並有法律保留原則之適用", "jy_number": 524, "year": "-", "location": "-", "paragraph_id": "1", "sentence_text": "並有法律保留原則之適用", "label_code": "-1", "label_name
