<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta http-equiv="refresh" content="0; url=principles_explorer.html#citation-query"><title>引用釋字查詢表已合併</title><script>location.replace('principles_explorer.html#citation-query'+location.search);</script></head><body><p><a href="principles_explorer.html#citation-query">前往憲法原則探索器的引用釋字查詢表</a></p><script id="return-to-deck-script">
(function(){
  const params = new URLSearchParams(location.search);
  const defaultBack = 'story_slides_1024x768.html#9';
  const validBack = /^(slides|mobile|slides_4x3|slides_800x600|slides_1024x768|story_slides|story_slides_mobile|story_slides_800x600|story_slides_1024x768)\.html#(?:story-)?(?:slide-)?\d+$/;
  let back = params.get('back') || defaultBack;
  if (!validBack.test(back)) back = defaultBack;
  const pageMatch = back.match(/#(?:slide-)?(\d+)$/);
  const pageText = back === defaultBack ? '返回主簡報第 9 頁 →' : (pageMatch ? `返回第 ${pageMatch[1]} 頁 →` : '返回主簡報 →');
  const deckFiles = /^(slides|mobile|slides_4x3|slides_800x600|slides_1024x768|story_slides|story_slides_mobile|story_slides_800x600|story_slides_1024x768)\.html/i;
  const mainFiles = /^(index|slides|mobile|slides_4x3|slides_800x600|slides_1024x768|story_slides|story_slides_mobile|story_slides_800x600|story_slides_1024x768)\.html$/i;
  document.querySelectorAll('a[href]').forEach(a => {
    const href = a.getAttribute('href') || '';
    const text = a.textContent || '';
    const file = (href.split(/[?#]/)[0].split('/').pop() || '');
    if (deckFiles.test(file) || /返回主簡報|返回第|返回 slides\.html/i.test(text)) {
      a.setAttribute('href', back);
      if (/返回主簡報|返回第|返回 slides\.html/i.test(text)) a.textContent = pageText;
      return;
    }
    if (/\.html$/i.test(file) && !mainFiles.test(file) && !/^(https?:|mailto:|tel:)/i.test(href)) {
      const u = new URL(href, location.href);
      u.searchParams.set('back', back);
      a.setAttribute('href', u.pathname.split('/').pop() + u.search + u.hash);
    }
  });
})();
</script></body></html>
