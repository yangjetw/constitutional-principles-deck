<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>互動時代背景時間軸</title><script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script><style>
:root{--paper:#fffaf0;--paper2:#f5ecd5;--ink:#2d2822;--muted:#6b5e52;--line:#3e352c;--teal:#4aa3a2;--yellow:#f3c969;--pink:#e76f82;--green:#80bd7a;--blue:#5ca7df}
*{box-sizing:border-box}body{margin:0;color:var(--ink);font-family:"Noto Sans TC","Microsoft JhengHei",sans-serif;background:linear-gradient(rgba(74,163,162,.12) 1px,transparent 1px),var(--paper2);background-size:100% 30px}.wrap{max-width:1180px;margin:0 auto;padding:34px 28px 44px}header{display:flex;justify-content:space-between;gap:20px;align-items:flex-start;margin-bottom:20px}h1{margin:0 0 8px;font-size:38px}p{color:var(--muted);line-height:1.55}a{color:#2f7777}.back{text-decoration:none;background:#d9f0e2;border:2px solid var(--line);border-radius:8px 13px 7px 12px;box-shadow:3px 4px 0 rgba(62,53,44,.14);padding:10px 14px;font-weight:900;white-space:nowrap}.panel{background:rgba(255,250,240,.9);border:2px solid var(--line);border-radius:12px 18px 10px 16px;box-shadow:6px 7px 0 rgba(62,53,44,.13);padding:18px;margin-top:18px}.filters{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:12px}.filters button{border:2px solid var(--line);background:#fffaf0;border-radius:999px;padding:8px 13px;cursor:pointer}.filters button.active{background:#fff4b8;color:#2f7777}.filterHint{display:inline-block;margin-left:4px;color:#e76f82;font-weight:900;font-size:16px}#chart{height:600px}.source{color:var(--muted);font-size:14px;line-height:1.6}.note{background:#fff4b8;border:2px solid var(--line);border-radius:9px 14px 8px 13px;padding:12px 14px;margin-top:12px}</style></head><body><div class="wrap"><header><div><h1>互動時代背景時間軸</h1><p>1947–2022 年憲政、社會與法制脈絡</p></div><a class="back" href="slides.html#17">返回 slides.html 第 17 頁</a></header><section class="panel"><div class="filters"><button class="active" data-cat="全部">全部</button><button data-cat="政治">政治</button><button data-cat="社會">社會</button><button data-cat="經濟">經濟</button><button data-cat="法制">法制</button><span class="filterHint">← 點擊可篩選</span></div><div id="chart"></div><div class="note">節點資料依論文的第二章第五節事件表整理；篩選類別為方便查詢，滑鼠移入事件的浮窗會保留原事件類型。</div></section><section class="panel source"><b>資料來源</b><p>作者依據論文第二章第五節「時代背景」及表 2-4 至表 2-9 整理。</p></section></div><script>
const periods=[{"name": "一、憲政建立與威權鞏固", "start": 1947, "end": 1970, "feature": "憲法施行、遷台、臨時條款與釋憲制度初步法制化"}, {"name": "二、經濟奇蹟與民主化起步", "start": 1971, "end": 1986, "feature": "出口導向工業化、國際孤立與民主化訴求升高"}, {"name": "三、解除戒嚴與憲政改革", "start": 1987, "end": 2000, "feature": "解除戒嚴、廢止臨時條款、國會改革、總統直選與政黨輪替"}, {"name": "四、國際接軌與多元化", "start": 2001, "end": 2022, "feature": "人權接軌、多元民主深化與憲法訴訟制度現代化"}];
const events=[{"year": 1947, "type": "體制", "category": "法制", "name": "《中華民國憲法》施行", "period": "一、憲政建立與威權鞏固", "description": "《中華民國憲法》經制憲國民大會於 1946 年通過，1947 年正式施行。"}, {"year": 1948, "type": "釋憲制度", "category": "法制", "name": "第一屆大法官就任", "period": "一、憲政建立與威權鞏固", "description": "《司法院組織法》法定額數為 17 人，第一屆大法官陸續就任。"}, {"year": 1949, "type": "政治", "category": "政治", "name": "國府遷台", "period": "一、憲政建立與威權鞏固", "description": "國民政府遷台，並頒布《動員戡亂時期臨時條款》。"}, {"year": 1949, "type": "體制", "category": "法制", "name": "《臨時條款》運作", "period": "一、憲政建立與威權鞏固", "description": "《動員戡亂時期臨時條款》的實施形成雙層法律體系，形式上憲法仍有效，實質上臨時條款取代憲法在政治決策中的核心地位。"}, {"year": 1949, "type": "釋憲制度", "category": "法制", "name": "無大法官會議正式集會紀錄", "period": "一、憲政建立與威權鞏固", "description": "1949 至 1952 年間受戰亂與政局動盪影響，釋憲制度實質上處於停滯狀態。"}, {"year": 1953, "type": "經濟改革", "category": "經濟", "name": "土地改革政策全部實施", "period": "一、憲政建立與威權鞏固", "description": "三七五減租、公地放領、耕者有其田等土地改革政策完成，為後續工業化奠定基礎。"}, {"year": 1957, "type": "釋憲制度", "category": "法制", "name": "修正《司法院組織法》", "period": "一、憲政建立與威權鞏固", "description": "明定大法官任期為九年，建立屆期制任命機制，制度化釋憲審查架構。"}, {"year": 1958, "type": "釋憲制度", "category": "法制", "name": "制定《司法院大法官會議法》", "period": "一、憲政建立與威權鞏固", "description": "將釋憲程序由命令性規範提升至法律位階。"}, {"year": 1958, "type": "釋憲制度", "category": "法制", "name": "第二屆大法官就任", "period": "一、憲政建立與威權鞏固", "description": "1958 年 9 月 15 日，首批適用九年任期制大法官就任，初任 17 人，多數由第一屆續任。"}, {"year": 1966, "type": "經濟建設", "category": "經濟", "name": "加工出口區設立", "period": "一、憲政建立與威權鞏固", "description": "高雄設立首個加工出口區，標誌出口導向型工業化起步。"}, {"year": 1966, "type": "釋憲制度", "category": "法制", "name": "釋字第117號解釋", "period": "一、憲政建立與威權鞏固", "description": "首次確立人民得聲請釋憲之制度基礎。"}, {"year": 1967, "type": "釋憲制度", "category": "法制", "name": "第三屆大法官就任", "period": "一、憲政建立與威權鞏固", "description": "1967 年 10 月 2 日就任，延續第二屆體制，持續釋憲職權，初任 17 人。"}, {"year": 1968, "type": "教育文化", "category": "社會", "name": "九年義務教育實施", "period": "一、憲政建立與威權鞏固", "description": "提高教育普及率，支撐經濟現代化需求。"}, {"year": 1969, "type": "政治變革", "category": "政治", "name": "增設增額立法委員", "period": "一、憲政建立與威權鞏固", "description": "部分擴大選民參與，但整體仍受威權結構限制。"}, {"year": 1971, "type": "政治", "category": "政治", "name": "中華民國退出聯合國", "period": "二、經濟奇蹟與民主化起步", "description": "國際處境轉趨孤立，政府更重視內部建設。"}, {"year": 1971, "type": "釋憲制度", "category": "法制", "name": "補任第三屆大法官2人", "period": "二、經濟奇蹟與民主化起步", "description": "補任第三屆大法官 2 人，維持大法官制度運作。"}, {"year": 1972, "type": "釋憲制度", "category": "法制", "name": "補任第三屆大法官4人", "period": "二、經濟奇蹟與民主化起步", "description": "補任第三屆大法官 4 人，補充大法官人事。"}, {"year": 1973, "type": "經濟", "category": "經濟", "name": "十大建設推動", "period": "二、經濟奇蹟與民主化起步", "description": "奠定工業化與現代化基礎。"}, {"year": 1976, "type": "釋憲制度", "category": "法制", "name": "第四屆大法官就任", "period": "二、經濟奇蹟與民主化起步", "description": "第四屆大法官就任，大法官制度持續運作。"}, {"year": 1979, "type": "政治／社會", "category": "政治", "name": "美麗島事件", "period": "二、經濟奇蹟與民主化起步", "description": "成為民主化發展的重要轉折。"}, {"year": 1980, "type": "經濟", "category": "經濟", "name": "出口加工區發展成熟", "period": "二、經濟奇蹟與民主化起步", "description": "1980 年代出口加工區發展成熟，帶動出口導向工業成長。"}, {"year": 1985, "type": "釋憲制度", "category": "法制", "name": "第五屆大法官就任", "period": "二、經濟奇蹟與民主化起步", "description": "第五屆大法官就任，新一屆大法官接續行使職權。"}, {"year": 1986, "type": "政治", "category": "政治", "name": "民進黨成立", "period": "二、經濟奇蹟與民主化起步", "description": "反威權運動進一步組織化。"}, {"year": 1987, "type": "政治／體制改革", "category": "政治", "name": "解除戒嚴", "period": "三、解除戒嚴與憲政改革", "description": "蔣經國總統宣布解除戒嚴，結束長達 38 年的威權統治，公民社會與政治參與空間擴大，新聞自由逐步恢復。"}, {"year": 1991, "type": "政治／憲政改革", "category": "法制", "name": "廢止《臨時條款》", "period": "三、解除戒嚴與憲政改革", "description": "國民大會通過修憲，廢止《動員戡亂時期臨時條款》，結束戒嚴體制下的憲法架構，恢復部分被限制的憲法條文效力。"}, {"year": 1992, "type": "體制改革", "category": "政治", "name": "國會全面改選", "period": "三、解除戒嚴與憲政改革", "description": "「萬年國會」制度被廢除，立法院首次舉行全面改選。"}, {"year": 1993, "type": "釋憲制度", "category": "法制", "name": "制定《大法官審理案件法》", "period": "三、解除戒嚴與憲政改革", "description": "訂定釋憲專法，建立案件分類、聲請門檻與審理程序，配合憲政改革，奠定憲法法庭制度基礎。"}, {"year": 1994, "type": "憲政改革", "category": "法制", "name": "總統直選制度的建立", "period": "三、解除戒嚴與憲政改革", "description": "憲法第三次增修條文通過，確立全民直選總統的機制。"}, {"year": 1994, "type": "釋憲制度", "category": "法制", "name": "第六屆大法官就任", "period": "三、解除戒嚴與憲政改革", "description": "第六屆大法官就任，任期九年，特任 16 人。"}, {"year": 1996, "type": "政治／選舉制度", "category": "政治", "name": "首次總統直選", "period": "三、解除戒嚴與憲政改革", "description": "臺灣首次舉行總統直選，民眾透過選票直接選出國家元首。"}, {"year": 1999, "type": "釋憲制度", "category": "法制", "name": "補任大法官3人", "period": "三、解除戒嚴與憲政改革", "description": "黃越欽、謝在全、賴英照就職，補為第六屆大法官。"}, {"year": 2000, "type": "政治／選舉制度", "category": "政治", "name": "政黨輪替", "period": "三、解除戒嚴與憲政改革", "description": "民主進步黨候選人陳水扁當選總統，實現 50 年來首次政黨輪替。"}, {"year": 2003, "type": "釋憲制度", "category": "法制", "name": "大法官新制15人就任", "period": "四、國際接軌與多元化", "description": "大法官改為定額 15 人、任期 8 年且不得連任，首次適用個別計算與輪動制度。"}, {"year": 2009, "type": "政治／人權", "category": "法制", "name": "《兩公約》內國法化", "period": "四、國際接軌與多元化", "description": "《公民與政治權利國際公約》與《經濟社會文化權利國際公約》內國法化，賦予國內法律效力。"}, {"year": 2014, "type": "社會運動", "category": "社會", "name": "太陽花學運", "period": "四、國際接軌與多元化", "description": "因《海峽兩岸服務貿易協議》審查過程被指欠缺透明，學生與公民團體占領立法院，直接促成《公投法》修訂與立法程序透明化進展。"}, {"year": 2020, "type": "法律／數位化", "category": "法制", "name": "數位法院試行", "period": "四、國際接軌與多元化", "description": "數位法院設立旨在推動司法程序現代化，利用人工智慧技術提升審判效率，保障訴訟當事人對等與正當法律程序。"}, {"year": 2022, "type": "釋憲制度", "category": "法制", "name": "《憲法訴訟法》施行", "period": "四、國際接軌與多元化", "description": "建立統一的憲法訴訟體系，並設置「憲法法庭」作為集中審理平台。"}];
const colors={政治:"#e76f82",社會:"#4aa3a2",經濟:"#f3c969",法制:"#5ca7df"};
function draw(cat="全部"){
  if(!window.Plotly){document.getElementById("chart").innerHTML='<div class="note">Plotly 尚未載入。事件資料已內嵌於本頁；若目前離線，請連線後重新整理即可顯示互動時間軸。</div>';return;}
  const filtered=events.filter(d=>cat==="全部"||d.category===cat);
  const shapes=periods.map((p,i)=>({type:"rect",xref:"x",yref:"paper",x0:p.start,x1:p.end,y0:0,y1:1,fillcolor:["rgba(74,163,162,.12)","rgba(243,201,105,.15)","rgba(231,111,130,.10)","rgba(92,167,223,.12)"][i%4],line:{width:0},layer:"below"}));
  const annotations=periods.map((p,i)=>({x:(p.start+p.end)/2,y:1.04,xref:"x",yref:"paper",showarrow:false,text:p.name,font:{size:13,color:"#6b5e52"}}));
  const trace={x:filtered.map(d=>d.year),y:filtered.map((_,i)=>i%5),mode:"markers+text",type:"scatter",text:filtered.map(d=>d.name),textposition:"top center",textfont:{size:11,color:"#2d2822"},marker:{size:14,color:filtered.map(d=>colors[d.category]||"#4aa3a2"),line:{color:"#3e352c",width:2}},customdata:filtered.map(d=>[d.period,d.category,d.type,d.description]),hovertemplate:"%{x}<br>%{text}<br>時期：%{customdata[0]}<br>篩選類別：%{customdata[1]}<br>原事件類型：%{customdata[2]}<br>%{customdata[3]}<extra></extra>"};
  Plotly.newPlot("chart",[trace],{paper_bgcolor:"rgba(0,0,0,0)",plot_bgcolor:"rgba(255,250,240,.72)",xaxis:{range:[1947,2022],title:"年份",dtick:10},yaxis:{visible:false,range:[-1,5]},margin:{l:30,r:24,t:60,b:54},shapes,annotations,showlegend:false,hoverlabel:{bgcolor:"#fffaf0",bordercolor:"#3e352c",font:{color:"#2d2822",size:14}}},{responsive:true,displayModeBar:false});
}
document.querySelectorAll("[data-cat]").forEach(btn=>btn.addEventListener("click",()=>{document.querySelectorAll("[data-cat]").forEach(b=>b.classList.toggle("active",b===btn));draw(btn.dataset.cat)}));
draw();
</script><script id="return-to-deck-script">
(function(){
  const params = new URLSearchParams(location.search);
  const back = params.get('back');
  if (!back || !/^(slides|mobile|slides_4x3|slides_800x600|slides_1024x768|story_slides|story_slides_800x600|story_slides_1024x768)\.html#(?:slide-)?\d+$/.test(back)) return;
  const pageMatch = back.match(/#(?:slide-)?(\d+)$/);
  const pageText = pageMatch ? `返回第 ${pageMatch[1]} 頁 →` : '返回主簡報 →';
  const deckFiles = /^(slides|mobile|slides_4x3|slides_800x600|slides_1024x768|story_slides|story_slides_800x600|story_slides_1024x768)\.html/i;
  const mainFiles = /^(index|slides|mobile|slides_4x3|slides_800x600|slides_1024x768|story_slides|story_slides_800x600|story_slides_1024x768)\.html$/i;
  document.querySelectorAll('a[href]').forEach(a => {
    const href = a.getAttribute('href') || '';
    const text = a.textContent || '';
    const file = (href.split(/[?#]/)[0].split('/').pop() || '');
    if (deckFiles.test(file) || /返回主簡報|返回第|返回 slides\.html/i.test(text)) {
      a.setAttribute('href', back);
      if (/返回主簡報|返回第|返回 slides\.html/i.test(text)) a.textContent = pageText;
      return;
    }
    if (/\.html$/i.test(file) && !mainFiles.test(file) && !/^(https?:|mailto:|tel:)/i.test(href)) {
      const u = new URL(href, location.href);
      u.searchParams.set('back', back);
      a.setAttribute('href', u.pathname.split('/').pop() + u.search + u.hash);
    }
  });
})();
</script></body></html>
