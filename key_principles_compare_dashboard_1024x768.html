</style></head><body class="projector-1024"><div class="wrap"><header><div><h1>三項關鍵憲法原則互動比較</h1><p>三項關鍵原則共同構成大法官審查國家權力的基本工具箱，但各自處理的問題與判斷方向並不相同。</p></div><a class="btn" href="story_slides_1024x768.html#9">返回主簡報第 9 頁 →</a></header><section class="panel"><h2>三個大問題</h2><div class="toolbox" id="toolbox"></div></section><section class="panel"><h2>引用與方向比較</h2><div id="compareChart" class="chart small"></div></section><section class="panel"><h2>完整比較表</h2><div class="tableWrap"><table id="compareTable" class="compareTable"></table></div></section><div class="footer"><a class="btn" href="story_slides_1024x768.html#9">返回主簡報第 9 頁 →</a></div></div><script>

(function(){
