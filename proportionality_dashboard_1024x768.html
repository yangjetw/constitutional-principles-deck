function renderStoryIntro(){let visual='';let note='';if(isProp()){visual=`<div class="principleScale" aria-label="比例原則審查示意"><svg viewBox="0 0 520 260" role="img"><line x1="260" y1="58" x2="260" y2="206"></line><line x1="132" y1="86" x2="388" y2="86"></line><line x1="164" y1="86" x2="116" y2="164"></line><line x1="356" y1="86" x2="404" y2="164"></line><path d="M72 164 Q116 206 160 164 Z"></path><path d="M360 164 Q404 206 448 164 Z"></path><text x="116" y="152" text-anchor="middle">公共目的</text><text x="404" y="152" text-anchor="middle">權利限制</text><circle cx="260" cy="86" r="14"></circle><text x="260" y="237" text-anchor="middle">比例審查</text></svg></div>`;note=`<div class="storyPrincipleNote"><b>起步較晚</b><span>但成為最常用的審查工具之一。</span></div>`}else if(isEquality()){visual=`<div class="principleRoad"><div><em>01</em><b>形式平等</b></div><i>→</i><div><em>02</em><b>差別待遇合理性</b></div><i>→</i><div><em>03</em><b>實質平等</b></div></div>`;note=`<div class="storyPrincipleNote"><b>最早登場</b><span>並隨社會議題逐步擴張。</span></div>`}else if(isLegalReservation()){visual=`<div class="principleGate"><div class="gateDoor"><b>法律依據</b><span>授權基礎</span></div><div class="gatePath"><span>國家行為</span><i>→</i><span>限制人民權利</span></div></div>`;note=`<div class="storyPrincipleNote"><b>前階審查</b><span>不是先問限制是否過度，而是先問國家有沒有資格限制。</span></div>`}if(!visual)return;storyIntro.innerHTML=`<section class="panel"><div class="dashVisual">${visual}${note}</div></section>`}
function renderKpis(){document.getElementById('kpiBox').innerHTML=`<div><b>首次出現</b><span>${key.firstYear}</span><p>釋字第 ${key.firstCase} 號</p></div><div><b>引用篇數</b><span>${key.count}</span><p>${key.pct}%</p></div><div><b>合憲</b><span>${key.con}</span></div><div><b>違憲</b><span>${key.uncon}</span></div><div><b>PI 值</b><span>${key.pi}</span><p>${key.direction}</p></div>`;mainNote.textContent=key.change;coreExtra.innerHTML=isProp()?`<div class="caseLine" style="margin-top:12px"><span>PI 接近 0，表示比例原則不預設合憲或違憲，而是依個案衡量限制是否過度。</span></div><div class="caseLine" style="margin-top:12px"><b>同號雙向案例 9 篇</b><span>同一釋字內同時出現合憲與違憲方向者：471、580、636、673、702、716、777、803、806。</span></div>`:isLegalReservation()?`<div class="caseLine" style="margin-top:12px"><span>PI 為 -0.26，顯示法律保留原則較常被用來指出國家行為欠缺法律依據、授權不足，或行政命令逾越授權界線。</span></div><div class="caseLine" style="margin-top:12px"><b>同號雙向案例 1 篇</b><span>同一釋字內同時出現合憲與違憲方向者：710。</span></div>`:''}
function renderProportionalityStory(){if(!isProp())return;propStory.innerHTML=`<section class="panel"><h2>變遷主軸</h2><div class="note axisLead">比例原則並非早期即大量出現，而是在 1996 年後進入釋字文本，並於 2001 年後快速常態化。其發展呈現「未明確引用 → 尚未成形 → 開始登場 → 常態使用」的變化。</div><div class="cards four periodCards" style="margin-top:12px"><div class="card"><b>1949–1970</b><strong>未明確引用</strong><span>威權體制下，基本權限制較少進入比例審查框架。</span></div><div class="card"><b>1971–1986</b><strong>尚未成形</strong><span>行政管制與人民權益衝突增加，但尚未轉化為比例原則語言。</span></div><div class="card"><b>1987–2000</b><strong>開始登場</strong><span>1996 年釋字第 409 號後，比例原則進入基本權限制審查。</span></div><div class="card"><b>2001–2021</b><strong>常態使用</strong><span>出現於 119 篇釋字，成為審查限制是否過度的重要框架。</span></div></div></section>`;propStages.innerHTML=`<section class="panel"><h2>功能變遷三階段</h2><div class="cards three stageCards"><div class="card"><strong>未形成工具</strong><span>早期釋字較少以「限制是否過度」審查國家行為。</span></div><div class="card"><strong>進入權利限制審查</strong><span>解嚴後，比例原則開始處理基本權限制與國家管制衝突。</span></div><div class="card"><strong>成為常態框架</strong><span>二十一世紀後，廣泛用於財產權、刑事制裁、集會自由、資訊隱私與制度改革等案件。</span></div></div></section>`;}
function renderEqualityStory(){if(!isEquality())return;propStory.innerHTML=`<section class="panel"><h2>變遷主軸</h2><div class="note axisLead">平等原則的變遷，不是單純引用數量增加，而是審查重點逐漸轉變：從早期法律上地位之平等，走向差別待遇合理性與實質平等審查，並在二十一世紀後擴展至性別、婚姻、宗教、租稅、工作權與制度改革等多元議題。</div><div class="cards four periodCards" style="margin-top:12px"><div class="card"><b>1949–1970</b><strong>尚未明確出現</strong><span>雖有憲法第 7 條基礎，但差別待遇問題尚未成為主要釋憲議題。</span></div><div class="card"><b>1971–1986</b><strong>開始萌芽</strong><span>平等原則最早於釋字第 179 號出現，開始進入釋字文本。</span></div><div class="card"><b>1987–2000</b><strong>合理性審查</strong><span>解嚴後，性別、身分與法律地位差異逐漸進入平等審查。</span></div><div class="card"><b>2001–2021</b><strong>場域擴張</strong><span>平等原則廣泛適用於婚姻、宗教、租稅、工作權與制度改革等多元議題。</span></div></div></section>`;propStages.innerHTML=`<section class="panel"><h2>功能變遷三階段</h2><div class="cards three stageCards"><div class="card"><strong>法律上地位平等</strong><span>早期主要處理人民在法律上地位是否受到平等對待。</span></div><div class="card"><strong>差別待遇合理性</strong><span>解嚴後，大法官開始檢查分類標準是否合理、差別待遇是否具有正當基礎。</span></div><div class="card"><strong>實質平等與多元議題</strong><span>二十一世紀後，平等原則進入性別、婚姻、宗教、租稅、工作權與制度改革等議題。</span></div></div></section>`;document.querySelector('.footer').insertAdjacentHTML('beforebegin',`<section class="panel"><h2>變遷型態</h2><div class="note axisLead">不同於比例原則呈現後期快速常態化，平等原則的變遷更接近長期累積與場域擴張。其核心變化在於，大法官對平等的理解，逐漸從形式上是否一律相同，轉向差別待遇是否合理，以及不同群體是否受到實質平等保障。</div></section>`);}
function renderLegalReservationStory(){if(!isLegalReservation())return;propStory.innerHTML=`<section class="panel"><h2>變遷主軸</h2><div class="note axisLead">法律保留原則的變遷，不是單純引用數量增加，而是大法官逐步將國家管制措施納入「有無法律依據」「授權是否明確」「行政機關是否逾越授權」的審查框架。其發展呈現「未明確引用 → 尚未成形 → 開始審查授權基礎 → 成為行政管制與基本權限制的重要工具」的變化。</div><div class="cards four periodCards" style="margin-top:12px"><div class="card"><b>1949–1970</b><strong>未明確引用</strong><span>威權體制下，行政權運作較少被放入法律保留框架審查。</span></div><div class="card"><b>1971–1986</b><strong>尚未成形</strong><span>行政管制增加，但尚未穩定轉化為法律保留原則的審查語言。</span></div><div class="card"><b>1987–2000</b><strong>開始審查授權基礎</strong><span>1993 年釋字第 313 號後，法律保留原則開始處理國家限制人民權利是否具有法律依據。</span></div><div class="card"><b>2001–2021</b><strong>穩定累積</strong><span>出現於 53 篇釋字，成為審查行政管制、授權依據與基本權限制的重要工具。</span></div></div></section>`;propStages.innerHTML=`<section class="panel"><h2>功能變遷三階段</h2><div class="cards three stageCards"><div class="card"><strong>尚未形成授權審查</strong><span>早期釋字較少以「是否具有法律依據」審查國家管制行為。</span></div><div class="card"><strong>進入行政法治化</strong><span>解嚴後，法律保留原則開始檢查行政機關限制人民權利時，是否具有法律授權。</span></div><div class="card"><strong>成為授權邊界審查工具</strong><span>二十一世紀後，廣泛用於財產權、服公職權、人身自由、職業自由、教育制度、社會給付與各類行政管制案件。</span></div></div></section>`;document.querySelector('.footer').insertAdjacentHTML('beforebegin',`<section class="panel"><h2>變遷型態</h2><div class="note axisLead">不同於比例原則的後期快速常態化，也不同於平等原則的長期累積與場域擴張，法律保留原則的變遷更接近行政法治化與授權邊界審查的展開。其核心變化在於，大法官逐漸要求國家限制人民權利時，必須具備足夠法律依據，且行政機關不得逾越授權範圍。</div></section>`);}
function trend(){let rows=yearly.filter(d=>d.name===key.name).sort((a,b)=>a.year-b.year);if(!rows.length){trend.innerHTML='<div class="missing">待匯入年度資料</div>';return;}if(isProp()){trendTags.innerHTML=`<div><b>1996</b><span>首見釋字第 409 號</span></div><div><b>2001</b><span>進入較穩定高頻期</span></div><div><b>2017–2021</b><span>密集使用</span></div>`;}if(isEquality()){trendTags.innerHTML=`<div><b>1983</b><span>首見釋字第 179 號</span></div><div><b>1990年代</b><span>差別待遇合理性審查逐漸展開</span></div><div><b>2001年後</b><span>適用場域持續拓寬</span></div>`;}if(isLegalReservation()){trendTags.innerHTML=`<div><b>1993</b><span>首見釋字第 313 號</span></div><div><b>1990年代</b><span>開始審查行政權授權基礎</span></div><div><b>2001年後</b><span>穩定累積並進入多類行政管制案件</span></div>`;}Plotly.newPlot('trend',[{type:'bar',x:rows.map(d=>d.year),y:rows.map(d=>d.count),marker:{color:'#4aa3a2',line:{color:'#3e352c',width:1.2}},hovertemplate:key.name+'<br>年份：%{x}<br>引用篇數：%{y}<extra></extra>'}],{paper_bgcolor:'rgba(0,0,0,0)',plot_bgcolor:'rgba(255,250,240,.72)',margin:{l:54,r:22,t:20,b:45},xaxis:{title:'年份',range:[1980,2021]},yaxis:{title:'引用篇數',dtick:1},shapes:[{type:'line',xref:'x',yref:'paper',x0:key.firstYear,x1:key.firstYear,y0:0,y1:1,line:{color:'#e76f82',dash:'dash',width:3}}],annotations:[{xref:'x',yref:'paper',x:key.firstYear,y:1.05,text:'首見：釋字第 '+key.firstCase+' 號',showarrow:false,font:{color:'#e76f82',size:14}}],hoverlabel:{bgcolor:'#fffaf0',bordercolor:'#3e352c',font:{color:'#2d2822',size:14}}},{displayModeBar:false,responsive:true})}
function coMeaning(d){const maps={'比例原則':{'平等原則':'差別待遇案件中，常同時檢視分類是否合理與限制是否過當。','最小侵害原則／必要性原則':'比例審查逐漸展開至必要性層次。','法律保留原則':'基本權限制案件中，「有無法律依據」與「限制是否過度」常被一併處理。'},'平等原則':{'比例原則':'差別待遇案件中，常同時檢視分類是否合理與限制是否過當。','法律保留原則':'涉及差別待遇的案件中，法律依據與權利限制基礎亦常被一併審查。','法律明確性原則':'分類標準或規範內容是否明確，亦可能影響平等審查。','最小侵害原則／必要性原則':'差別待遇或限制手段是否必要，常與平等審查共同出現。'},'法律保留原則':{'比例原則':'基本權限制案件中，「有無法律依據」與「限制是否過度」常被一併處理。','法律授權明確原則':'審查法律依據時，常同時要求授權內容、目的與範圍足夠明確。','法律明確性原則':'規範本身是否清楚，也會影響國家限制人民權利的合憲性判斷。','平等原則':'涉及差別待遇或制度分類的案件中，法律依據與平等審查可能同時被處理。'}};return (maps[key.name]&&maps[key.name][d.name])||''}
function renderExtra(){let html=(isProp()||isEquality()||isLegalReservation())?'':`<div class="note">${key.function}</div>`;if(key.fields){html+=`<div class="tagCloud">${key.fields.map(x=>`<span>${x}</span>`).join('')}</div>`}if(key.name==='法律保留原則'){html+=`<div class="layerBox"><div>是否有法律依據？</div><div>授權是否明確？</div><div>行政機關是否逾越授權？</div></div>`}document.getElementById('extraBox').innerHTML=html;let max=Math.max(...key.co.map(d=>d.count),1);coBars.innerHTML=key.co.map(d=>`<div class="barRow"><label class="coLabel"><strong>${d.name} ${d.count}</strong><span>${coMeaning(d)}</span></label><div class="track"><div class="fill" style="width:${d.count/max*100}%"></div></div></div>`).join('')}

(function(){
  const params = new URLSearchParams(location.search);
  const defaultBack = 'story_slides_1024x768.html#9';
  const validBack = /^(slides|mobile|slides_4x3|slides_800x600|slides_1024x768|story_slides|story_slides_mobile|story_slides_800x600|story_slides_1024x768)\.html#(?:story-)?(?:slide-)?\d+$/;
  let back = params.get('back') || defaultBack;
  if (!validBack.test(back)) back = defaultBack;
  const pageMatch = back.match(/#(?:slide-)?(\d+)$/);
  const pageText = back === defaultBack ? '返回主簡報第 9 頁 →' : (pageMatch ? `返回第 ${pageMatch[1]} 頁 →` : '返回主簡報 →');
  const deckFiles = /^(slides|mobile|slides_4x3|slides_800x600|slides_1024x768|story_slides|story_slides_mobile|story_slides_800x600|story_slides_1024x768)\.html/i;
  const mainFiles = /^(index|slides|mobile|slides_4x3|slides_800x600|slides_1024x768|story_slides|story_slides_mobile|story_slides_800x600|story_slides_1024x768)\.html$/i;
  document.querySelectorAll('a[href]').forEach(a => {
    const href = a.getAttribute('href') || '';
    const text = a.textContent || '';
    const file = (href.split(/[?#]/)[0].split('/').pop() || '');
    if (deckFiles.test(file) || /返回主簡報|返回第|返回 slides\.html/i.test(text)) {
      a.setAttribute('href', back);
      if (/返回主簡報|返回第|返回 slides\.html/i.test(text)) a.textContent = pageText;
      return;
    }
    if (/\.html$/i.test(file) && !mainFiles.test(file) && !/^(https?:|mailto:|tel:)/i.test(href)) {
      const u = new URL(href, location.href);
      u.searchParams.set('back', back);
      a.setAttribute('href', u.pathname.split('/').pop() + u.search + u.hash);
    }
  });
})();
