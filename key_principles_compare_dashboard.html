const keys=[{"name": "比例原則", "question": "限制是否過度？", "function": "檢查國家限制人民權利的手段是否逾越必要範圍。", "first": "1996 年，釋字第 409 號", "firstYear": 1996, "firstCase": 409, "count": 140, "pct": 17.22, "con": 53, "uncon": 44, "pi": 0.09, "direction": "接近中性", "type": "關鍵雙向型原則", "change": "起步較晚，後期快速增加；第三時期開始處理基本權限制，第四時期成為常態性審查工具。", "co": [{"name": "平等原則", "count": 48}, {"name": "最小侵害原則／必要性原則", "count": 31}, {"name": "法律保留原則", "count": 26}]}, {"name": "平等原則", "question": "差別待遇是否合理？", "function": "檢查法律分類、身分差異與資源分配是否具有正當理由。", "first": "1983 年，釋字第 179 號", "firstYear": 1983, "firstCase": 179, "count": 112, "pct": 13.78, "con": 36, "uncon": 25, "pi": 0.18, "direction": "略偏合憲但仍屬雙向", "type": "關鍵雙向型原則", "change": "從形式平等，走向差別待遇合理性與實質平等審查。", "fields": ["法律上地位", "性別", "宗教", "婚姻", "租稅", "工作權", "制度改革"], "co": [{"name": "比例原則", "count": 48}, {"name": "法律保留原則", "count": 16}, {"name": "法律明確性原則", "count": 15}, {"name": "最小侵害原則／必要性原則", "count": 14}]}, {"name": "法律保留原則", "question": "是否具有法律依據？", "function": "檢查國家限制人民權利是否具有法律依據與授權基礎。", "first": "1993 年，釋字第 313 號", "firstYear": 1993, "firstCase": 313, "count": 64, "pct": 7.87, "con": 16, "uncon": 27, "pi": -0.26, "direction": "較偏違憲", "type": "違憲警示型原則", "change": "1990 年代後正式進入釋字文本，第四時期成為行政管制與基本權限制案件中的重要審查工具。", "co": [{"name": "比例原則", "count": 26}, {"name": "法律授權明確原則", "count": 21}, {"name": "法律明確性原則", "count": 16}, {"name": "平等原則", "count": 16}]}];
toolbox.innerHTML=keys.map(k=>`<div><b>${k.name}</b><span>${k.question}</span><p>${k.function}</p></div>`).join('');
Plotly.newPlot('compareChart',[{type:'bar',x:keys.map(k=>k.name),y:keys.map(k=>k.count),name:'引用篇數',marker:{color:'#4aa3a2'}},{type:'scatter',mode:'lines+markers',x:keys.map(k=>k.name),y:keys.map(k=>k.pi),name:'PI 值',yaxis:'y2',line:{color:'#e76f82',width:4},marker:{size:10,color:'#fff4b8',line:{color:'#3e352c',width:1.5}}}],{paper_bgcolor:'rgba(0,0,0,0)',plot_bgcolor:'rgba(255,250,240,.72)',margin:{l:54,r:54,t:20,b:50},yaxis:{title:'引用篇數'},yaxis2:{title:'PI 值',overlaying:'y',side:'right',range:[-1,1]},legend:{orientation:'h'},hoverlabel:{bgcolor:'#fffaf0',bordercolor:'#3e352c',font:{color:'#2d2822',size:14}}},{displayModeBar:false,responsive:true});
const rows=[['首次出現',...keys.map(k=>k.first)],['引用篇數',...keys.map(k=>k.count+' 篇')],['占全部釋字比例',...keys.map(k=>k.pct+'%')],['合憲引用數',...keys.map(k=>k.con)],['違憲引用數',...keys.map(k=>k.uncon)],['PI 值',...keys.map(k=>k.pi)],['判斷方向',...keys.map(k=>k.direction)],['主要審查功能',...keys.map(k=>k.question)],['發展特徵',...keys.map(k=>k.change)],['主要共現關係',...keys.map(k=>k.co.map(c=>c.name+' '+c.count+' 篇').join('；'))]];
compareTable.innerHTML='<thead><tr><th>比較項目</th>'+keys.map(k=>`<th>${k.name}</th>`).join('')+'</tr></thead><tbody>'+rows.map(r=>'<tr>'+r.map(c=>`<td>${c}</td>`).join('')+'</tr>').join('')+'</tbody>';
</script></body></html>
