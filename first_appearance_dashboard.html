function draw(){document.querySelectorAll('[data-first]').forEach(b=>b.classList.toggle('active',b.dataset.first===firstMode));let r=rows();if(window.Plotly){Plotly.newPlot('firstChart',[{type:'scatter',mode:'markers+text',x:r.map(d=>d.firstYear),y:r.map(d=>d.name),text:r.map(d=>d.name.replace('原則','')),textposition:'middle right',marker:{size:r.map(d=>10+Math.sqrt(d.count)*2),color:'#f3c969',line:{color:'#3e352c',width:2}},customdata:r.map(d=>[d.firstCase,d.firstSource,d.count]),hovertemplate:'%{y}<br>首次年份：%{x}<br>首次釋字：%{customdata[0]}<br>位置：%{customdata[1]}<br>後續出現篇數：%{customdata[2]}<extra></extra>'}],{paper_bgcolor:'rgba(0,0,0,0)',plot_bgcolor:'rgba(255,250,240,.72)',margin:{l:170,r:40,t:20,b:45},xaxis:{title:'首次出現年份'},hoverlabel:{bgcolor:'#fffaf0',bordercolor:'#3e352c',font:{color:'#2d2822',size:14}}},{displayModeBar:false,responsive:true});}else{document.getElementById('firstChart').innerHTML='<div class="fallback">'+r.map(d=>`<div class="row"><b>${d.firstYear}</b><div class="track"><div class="fill" style="width:${d.count/Math.max(...r.map(x=>x.count))*100}%"></div></div><span>${d.name}</span></div>`).join('')+'</div>'}table(r)}
function table(r){document.getElementById('firstTable').innerHTML='<thead><tr><th>原則名稱</th><th>首次出現年份</th><th>首次出現釋字</th><th>位置</th><th>出現篇數</th></tr></thead><tbody>'+r.map(d=>`<tr><td>${d.name}</td><td>${d.firstYear||'-'}</td><td>${d.firstCase||'-'}</td><td>${d.firstSource||'-'}</td><td>${d.count}</td></tr>`).join('')+'</tbody>'}
function setupPrincipleSelect(){const names=[...new Set(principleYearly.map(d=>d.name))].sort((a,b)=>a.localeCompare(b,'zh-Hant'));const sel=document.getElementById('principleSelect');sel.innerHTML=names.map(n=>`<option value="${n}">${n}</option>`).join('');if(names.includes(selectedPrinciple))sel.value=selectedPrinciple;else selectedPrinciple=names[0]||'';}
function principleTrend(){const r=principleYearly.filter(d=>d.name===selectedPrinciple).sort((a,b)=>a.year-b.year);document.getElementById('principleTrendNote').textContent=r.length?`${selectedPrinciple}：共 ${r.reduce((s,d)=>s+d.count,0)} 篇年度引用，出現於 ${r.length} 個年份；X 軸固定為 1949–2021，空白年份代表未出現。`:'待匯入年度原則明細資料';if(!r.length){document.getElementById('principleTrend').innerHTML='<div class="missing">待匯入年度原則明細資料</div>';return;}if(window.Plotly){Plotly.newPlot('principleTrend',[{type:'bar',x:r.map(d=>d.year),y:r.map(d=>d.count),marker:{color:'#4aa3a2'},customdata:r.map(d=>[d.name]),hovertemplate:'%{customdata[0]}<br>年份：%{x}<br>出現釋字篇數：%{y}<extra></extra>'}],{paper_bgcolor:'rgba(0,0,0,0)',plot_bgcolor:'rgba(255,250,240,.72)',margin:{l:54,r:22,t:20,b:45},xaxis:{title:'年份',range:[1949,2021],dtick:10},yaxis:{title:'出現釋字篇數',dtick:1},hoverlabel:{bgcolor:'#fffaf0',bordercolor:'#3e352c',font:{color:'#2d2822',size:14}}},{displayModeBar:false,responsive:true});}else{document.getElementById('principleTrend').innerHTML='<div class="fallback">'+r.map(d=>`<div class="row"><b>${d.year}</b><div class="track"><div class="fill" style="width:${d.count/Math.max(...r.map(x=>x.count))*100}%"></div></div><span>${d.count}</span></div>`).join('')+'</div>'}}
document.body.addEventListener('click',e=>{let f=e.target.closest('[data-first]');if(f){firstMode=f.dataset.first;draw()}let q=e.target.closest('[data-quick]');if(q){selectedPrinciple=q.dataset.quick;document.getElementById('principleSelect').value=selectedPrinciple;principleTrend();}});document.addEventListener('change',e=>{if(e.target.id==='principleSelect'){selectedPrinciple=e.target.value;principleTrend();}});setupPrincipleSelect();draw();principleTrend();
</script></body></html>
